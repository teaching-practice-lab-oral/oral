<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 - AI 英語面試練習系統</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI 英語面試" />
  <meta name="application-name" content="AI 英語面試" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="登入 AI 輔助英語面試練習系統" />
  <meta property="og:title" content="登入 - AI 英語面試練習系統" />
  <meta property="og:description" content="AI 輔助英語面試練習系統，幫助大學生提升英語面試能力。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/static/favicon.svg" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
  crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD"
  crossorigin="anonymous" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4338ca 70%, #6d28d9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage-watermark {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 0;
      display: none;
      transform: translate(-50%, -50%) rotate(-12deg);
      color: #fff;
      font-size: clamp(8rem, 25vw, 24rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1;
      opacity: 0.08;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
    .stage-watermark.is-visible { display: block; }
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }
    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 2rem 2rem 1.5rem;
      text-align: center;
      color: white;
    }
    .login-header .icon-wrap {
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.8rem;
    }
    .login-header h1 { font-size: 1.35rem; font-weight: 700; margin: 0; }
    .login-header p { font-size: 0.85rem; opacity: 0.85; margin: 0.3rem 0 0; }
    .login-body { padding: 2rem; }
    .input-group-text {
      background: #f1f5f9;
      border-right: none;
      color: #6366f1;
    }
    .form-control {
      border-left: none;
    }
    .form-control:focus {
      box-shadow: none;
      border-color: #6366f1;
    }
    .input-group:focus-within .input-group-text {
      border-color: #6366f1;
    }
    .btn-login {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.65rem;
      border-radius: 10px;
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.9; color: white; }
    .btn-login:disabled { opacity: 0.7; }
    .cf-turnstile { display: flex; justify-content: center; margin-bottom: 1rem; }
    .reset-link-wrap {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }
    .reset-link-wrap a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
    .reset-link-wrap a:hover {
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }
    .legal-links {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 0.85rem;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .legal-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 9.25rem;
      padding: 0.7rem 1rem;
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
      line-height: 1.2;
      border: 1px solid rgba(37, 99, 235, 0.14);
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.05);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.75) inset;
      white-space: nowrap;
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .legal-links a:hover {
      color: #1e40af;
      background: rgba(37, 99, 235, 0.09);
      border-color: rgba(37, 99, 235, 0.22);
      transform: translateY(-1px);
      text-decoration: none;
    }
    @media (max-width: 420px) {
      .legal-links {
        gap: 0.5rem;
        flex-wrap: nowrap;
        justify-content: space-between;
      }
      .legal-links a {
        min-width: 0;
        flex: 1 1 0;
        padding: 0.5rem 0.6rem;
        font-size: 0.72rem;
        line-height: 1.15;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <div id="stageWatermark" class="stage-watermark" aria-hidden="true">Stage</div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <div class="icon-wrap"><i class="bi bi-mic-fill"></i></div>
        <h1>AI 英語面試練習系統</h1>
        <p>English Interview Practice System</p>
      </div>
      <div class="login-body">
        <div id="alertBox" class="alert d-none mb-3" role="alert"></div>
        <form id="loginForm" autocomplete="on">
          <div class="mb-3">
            <label for="studentId" class="form-label fw-semibold text-secondary small">學號</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
              <input type="text" class="form-control" id="studentId" name="username" maxlength="64" placeholder="例：B10101001" autocomplete="username" required />
            </div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold text-secondary small">密碼</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" maxlength="256" placeholder="請輸入密碼" autocomplete="current-password" required />
              <button type="button" class="btn btn-outline-secondary" id="togglePassword" aria-label="顯示密碼" aria-pressed="false">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="cf-turnstile" data-sitekey="__TURNSTILE_SITE_KEY__" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired" data-error-callback="onTurnstileExpired" id="turnstileWidget"></div>
          <button type="submit" class="btn btn-login w-100" id="loginBtn" disabled>
            <span id="loginSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
            <i class="bi bi-box-arrow-in-right me-1"></i> 登入
          </button>
          <div class="reset-link-wrap">
            <a href="/reset-password" class="text-decoration-none small fw-semibold">
              <i class="bi bi-key me-1"></i>忘記密碼／重設密碼
            </a>
          </div>
          <div class="legal-links small" aria-label="使用者條款與隱私權政策">
            <a id="loginSystemTerms" href="#" target="_blank" rel="noopener noreferrer">使用者條款</a>
            <a id="loginPrivacyNotice" href="#" target="_blank" rel="noopener noreferrer">隱私權政策</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/pwa.js?v=7"></script>
  <script src="/static/login.js?v=4"></script>
  <script>
    if (window.location.hostname.startsWith('dev-')) {
      document.getElementById('stageWatermark').classList.add('is-visible');
    }
  </script>

</body>
</html>
