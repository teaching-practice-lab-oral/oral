<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 - AI 英語面試練習系統</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI 英語面試" />
  <meta name="application-name" content="AI 英語面試" />
  <meta name="theme-color" content="#1F3A5F" />
  <meta name="description" content="登入 AI 輔助英語面試練習系統" />
  <meta property="og:title" content="登入 - AI 英語面試練習系統" />
  <meta property="og:description" content="AI 輔助英語面試練習系統，幫助大學生提升英語面試能力。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/static/favicon.svg" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous"/>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body {
      min-height: 100vh;
      background: #F5F6F8;
      color: #1F2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage-watermark {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 0;
      display: none;
      transform: translate(-50%, -50%) rotate(-12deg);
      color: #1F3A5F;
      font-size: clamp(8rem, 25vw, 24rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1;
      opacity: 0.06;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
    .stage-watermark.is-visible { display: block; }
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }
    .login-card {
      background: #fff;
      border: 1px solid #DDE1E7;
      border-radius: 8px;
      overflow: hidden;
    }
    .login-header {
      background: #fff;
      padding: 2rem 2rem 1.25rem;
      text-align: center;
      color: #1F2328;
      border-top: 4px solid #1F3A5F;
      border-bottom: 1px solid #DDE1E7;
    }
    .login-header h1 { font-size: 1.35rem; font-weight: 700; margin: 0; }
    .login-header p { font-size: 0.85rem; color: #5E6673; margin: 0.3rem 0 0; }
    .login-body { padding: 2rem; }
    .input-group-text {
      background: #F8F9FA;
      border-right: none;
      color: #5E6673;
    }
    .form-control {
      border-left: none;
    }
    .form-control:focus {
      box-shadow: none;
      border-color: #1F3A5F;
    }
    .input-group:focus-within .input-group-text {
      border-color: #1F3A5F;
    }
    .btn-login {
      background: #1F3A5F;
      border: 1px solid #1F3A5F;
      color: white;
      font-weight: 600;
      padding: 0.65rem;
      border-radius: 6px;
      transition: background-color 0.15s;
    }
    .btn-login:hover { background: #172C48; color: white; }
    .btn-login:disabled { opacity: 0.7; }
    .cf-turnstile { display: flex; justify-content: center; margin-bottom: 1rem; }
    .reset-link-wrap {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }
    .reset-link-wrap a {
      color: #1F3A5F;
      font-weight: 600;
      text-decoration: none;
    }
    .reset-link-wrap a:hover {
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }
    .legal-links {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 0.85rem;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .legal-links a {
      color: #5E6673;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 0.18em;
      text-decoration-color: rgba(94,102,115,.4);
    }
    .legal-links a:hover { color: #1F2328; text-decoration-color: currentColor; }
    @media (max-width: 420px) {
      .legal-links { gap: 1rem; }
    }
  </style>
  <link rel="stylesheet" href="/static/css/ui.css">
</head>
<body>
  <div id="stageWatermark" class="stage-watermark" aria-hidden="true">Stage</div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <h1>AI 英語面試練習系統</h1>
        <p>English Interview Practice System</p>
      </div>
      <div class="login-body">
        <div id="alertBox" class="alert d-none mb-3" role="alert"></div>
        <form id="loginForm" autocomplete="on">
          <div class="mb-3">
            <label for="studentId" class="form-label fw-semibold text-secondary small">學號</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
              <input type="text" class="form-control" id="studentId" name="username" maxlength="64" placeholder="例：B10101001" autocomplete="username" required />
            </div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold text-secondary small">密碼</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" maxlength="256" placeholder="請輸入密碼" autocomplete="current-password" required />
              <button type="button" class="btn btn-outline-secondary" id="togglePassword" aria-label="顯示密碼" aria-pressed="false">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="cf-turnstile" data-sitekey="__TURNSTILE_SITE_KEY__" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired" data-error-callback="onTurnstileExpired" id="turnstileWidget"></div>
          <button type="submit" class="btn btn-login w-100" id="loginBtn" disabled>
            <span id="loginSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
            登入
          </button>
          <div class="reset-link-wrap">
            <a href="/reset-password" class="text-decoration-none small fw-semibold">
              忘記密碼／重設密碼
            </a>
          </div>
          <div class="legal-links small" aria-label="使用者條款與隱私權政策">
            <a id="loginSystemTerms" href="#" target="_blank" rel="noopener noreferrer">使用者條款</a>
            <a id="loginPrivacyNotice" href="#" target="_blank" rel="noopener noreferrer">隱私權政策</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/pwa.js"></script>
  <script src="/static/login.js"></script>
  <script>
    if (window.location.hostname.startsWith('dev-')) {
      document.getElementById('stageWatermark').classList.add('is-visible');
    }
  </script>

</body>
</html>
