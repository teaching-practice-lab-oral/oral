<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI 英語面試" />
  <meta name="application-name" content="AI 英語面試" />

  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />

  <meta property="og:title" content="角色扮演 — AI 英語面試練習系統" />
  <meta property="og:description" content="與 AI 進行模擬英語面試對話練習。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/static/favicon.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous"/>
  <link rel="stylesheet" href="/static/student/common.css" />
  <style>
    .btn-record { background: var(--danger); border: 1px solid var(--danger); color: white; border-radius: var(--radius-sm); padding: 0.55rem 1.4rem; font-weight: 600; }
    .btn-record:hover { background: #8F1E18; border-color: #8F1E18; color: white; }
    .btn-stop { background: var(--ink); border: 1px solid var(--ink); color: white; border-radius: var(--radius-sm); padding: 0.55rem 1.4rem; font-weight: 600; }
    .btn-stop:hover { background: #000; color: white; }
    audio { border-radius: var(--radius-sm); width: 100%; max-width: 500px; }
    .timer-display { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--danger); }
    .chat-container { background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; max-height: 500px; overflow-y: auto; }
    .chat-bubble { max-width: 75%; padding: 0.75rem 1rem; border-radius: var(--radius); margin-bottom: 0.75rem; line-height: 1.6; }
    .chat-interviewer { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 2px; margin-right: auto; }
    .chat-student { background: var(--primary); color: white; border-top-right-radius: 2px; margin-left: auto; }
    .chat-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.02em; margin-bottom: 0.25rem; opacity: .8; }
    .turn-badge { display: inline-block; background: var(--primary-soft); color: var(--primary); border-radius: var(--radius-sm); padding: 0.2rem 0.7rem; font-size: 0.8rem; font-weight: 700; }
    .bridge-card { background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.15rem; }
    .starter-chip { display: inline-block; background: var(--surface); border: 1px solid var(--border); color: var(--ink); border-radius: var(--radius-sm); padding: .2rem .6rem; margin: .15rem .2rem .15rem 0; font-size: .78rem; }
    .profile-reminder { background: var(--surface-soft); border-left: 3px solid var(--primary); padding: .65rem .8rem; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
    @media (max-width: 575.98px) {
      .chat-container { padding: .65rem; max-height: 60vh; }
      .chat-bubble { max-width: 90%; padding: .6rem .75rem; }
      .bridge-card { padding: .75rem .85rem; }
      .timer-display { font-size: 1.35rem; }
      .btn-record, .btn-stop { padding: .5rem 1rem; }
    }
  </style>
  <link rel="stylesheet" href="/static/css/ui.css">
</head>
<body>
  <nav class="navbar navbar-custom navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand text-white fw-bold" href="/student">
        <i class="bi bi-arrow-left me-2"></i>返回作業列表
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="attempt-badge d-none" id="attemptBadge"></span>
        <button class="btn btn-outline-light btn-sm" data-action="logout">
          登出
        </button>
      </div>
    </div>
  </nav>

  <div id="toastContainer"></div>

  <div class="container mt-4 mb-5 maxw-860">
    <div id="loadingMsg" class="text-center py-5">
      <div class="spinner-border text-primary spinner-lg"></div>
      <p class="mt-3 text-muted">載入中...</p>
    </div>

    <div id="content" class="d-none">
      <div class="mb-4">
        <h3 id="assignmentTitle" class="fw-bold mb-1"></h3>
        <p id="dueDate" class="text-muted small mb-0"></p>
      </div>
      <div class="progress-steps" id="progressSteps"></div>
      <div id="viewModeBanner" class="d-none mb-3"></div>
      <div id="sectionContainer"></div>
      <div class="section-nav" id="sectionNav"></div>
    </div>
  </div>

  <script>window.CURRENT_SECTION = 4; window.PAGE_PATH = 'roleplay';</script>
  <script src="/static/student/workflow.js"></script>
  <script src="/static/student/common.js"></script>
  <script src="/static/pwa.js"></script>
  <script src="/static/student/practice-runtime.js"></script>
  <script type="module" src="/static/student/controllers/roleplay.mjs"></script>

</body>
</html>
