  <style>
    .btn-record { background: linear-gradient(90deg, #ef4444, #dc2626); border: none; color: white; border-radius: 10px; padding: 0.55rem 1.4rem; font-weight: 600; }
    .btn-stop { background: #475569; border: none; color: white; border-radius: 10px; padding: 0.55rem 1.4rem; font-weight: 600; }
    audio { border-radius: 10px; width: 100%; max-width: 500px; }
    .timer-display { font-size: 1.6rem; font-weight: 700; font-family: 'Courier New', monospace; color: #ef4444; }
    .chat-container { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 1rem; max-height: 500px; overflow-y: auto; }
    .chat-bubble { max-width: 75%; padding: 0.75rem 1rem; border-radius: 16px; margin-bottom: 0.75rem; line-height: 1.5; }
    .chat-interviewer { background: white; border: 1px solid #e2e8f0; border-radius: 4px 16px 16px 16px; margin-right: auto; }
    .chat-student { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; border-radius: 16px 16px 4px 16px; margin-left: auto; }
    .chat-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 0.25rem; }
    .turn-badge { display: inline-block; background: linear-gradient(90deg, #4f46e5, #7c3aed); color: white; border-radius: 20px; padding: 0.25rem 0.9rem; font-size: 0.8rem; font-weight: 700; }
    .bridge-card { background: linear-gradient(135deg,#eef2ff,#f8fafc); border: 1px solid #c7d2fe; border-radius: 14px; padding: 1rem 1.15rem; }
    .scaffold-card { background: #fffbeb; border: 1px solid #fde68a; border-radius: 14px; padding: 1rem 1.15rem; margin-bottom: 1rem; }
    .scaffold-step { background: white; border: 1px solid #f3e8c2; border-radius: 10px; padding: .65rem .75rem; height: 100%; }
    .starter-chip { display: inline-block; background: white; border: 1px solid #f59e0b; color: #92400e; border-radius: 999px; padding: .2rem .6rem; margin: .15rem .2rem .15rem 0; font-size: .78rem; }
    .profile-reminder { background: #f8fafc; border-left: 3px solid #6366f1; padding: .65rem .8rem; border-radius: 0 8px 8px 0; }
  </style>

      <div id="viewModeBanner" class="d-none mb-3"></div>
