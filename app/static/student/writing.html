  <style>
    .sub-step { border-left: 3px solid #e2e8f0; padding-left: 1.25rem; margin-bottom: 1.5rem; }
    .sub-step.done { border-left-color: var(--success); }
    .sub-step.active-step { border-left-color: var(--primary); }
    .sub-step-label { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .sub-step.done .sub-step-label { color: var(--success); }
    .sub-step.active-step .sub-step-label { color: var(--primary); }
    .feedback-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem 1.25rem; }
    .correction-card { border-radius: 10px; border: 1px solid #fecaca; background: #fff5f5; padding: 0.85rem 1rem; margin-bottom: 0.75rem; }
    .correction-card .cc-original { color: #dc2626; font-style: italic; margin-bottom: 0.4rem; }
    .correction-card .cc-corrected { color: #065f46; font-weight: 600; margin-bottom: 0.4rem; }
    .correction-card .cc-explanation { color: #475569; font-size: 0.85rem; }
    .polished-box { border-left: 3px solid #4f46e5; padding: 0.8rem 1rem; background: #eef2ff; border-radius: 0 12px 12px 0; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; }
    .form-control-modern { border-radius: 12px; border: 1.5px solid #e2e8f0; padding: 0.9rem 1rem; transition: border-color 0.2s, box-shadow 0.2s; background: white; }
    .form-control-modern:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); outline: none; }
    .btn-outline-primary-custom { border: 2px solid #4f46e5; color: #4f46e5; background: white; border-radius: 10px; padding: 0.55rem 1.4rem; font-weight: 600; transition: all 0.15s; }
    .btn-outline-primary-custom:hover { background: #4f46e5; color: white; }
  </style>
</head>
<body>
  <nav class="navbar navbar-custom navbar-expand-lg">

        </button>

    </div>
  </nav>

  <div id="toastContainer"></div>

  <div class="container mt-4 mb-5" style="max-width: 860px;">

      <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
      <p class="mt-3 text-muted">載入中...</p>
    </div>

    <div id="content" class="d-none">
      <div class="mb-4">
        <h3 id="assignmentTitle" class="fw-bold mb-1"></h3>
        <p id="assignmentDesc" class="text-muted mb-1"></p>
        <p id="dueDate" class="text-muted small mb-0"></p>
      </div>
      <div class="progress-steps" id="progressSteps"></div>
      <div id="viewModeBanner" class="d-none mb-3"></div>
      <div id="sectionContainer"></div>
      <div class="section-nav" id="sectionNav"></div>
    </div>
  </div>

  <script>window.CURRENT_SECTION = 2; window.PAGE_PATH = 'writing';</script>
