  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous"/>
  <link rel="stylesheet" href="/static/student/common.css" />
  <style>
    .sub-step { border-left: 3px solid var(--border); padding-left: 1.25rem; margin-bottom: 1.5rem; }
    .sub-step.done { border-left-color: var(--success); }
    .sub-step.active-step { border-left-color: var(--primary); }
    .sub-step-label { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 0.5rem; color: var(--muted); }
    .sub-step.done .sub-step-label { color: var(--success); }
    .sub-step.active-step .sub-step-label { color: var(--primary); }
    .feedback-box { background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; }
    .correction-card { border-radius: var(--radius); border: 1px solid var(--border); border-left: 3px solid var(--success); background: var(--surface); padding: 0.85rem 1rem; margin-bottom: 0.75rem; }
    .correction-card .cc-original { color: var(--muted); font-size: .9rem; margin-bottom: 0.4rem; }
    .correction-card .cc-corrected { color: var(--ink); font-weight: 500; margin-bottom: 0.4rem; }
    .correction-card .cc-explanation { color: var(--muted); font-size: 0.85rem; padding-top: .4rem; border-top: 1px dashed var(--border); }
    .cc-tag { display: inline-block; margin-right: .45rem; padding: 0 .4rem; border-radius: 4px; font-size: .72rem; font-weight: 700; vertical-align: .1em; }
    .cc-original .cc-tag { background: #EEF0F3; color: var(--muted); }
    .cc-corrected .cc-tag { background: var(--success-soft); color: var(--success); }
    .polished-box { border-left: 3px solid var(--primary); padding: 0.8rem 1rem; background: var(--primary-soft); border-radius: 0 var(--radius) var(--radius) 0; }
    .form-control-modern { border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 0.9rem 1rem; transition: border-color 0.2s, box-shadow 0.2s; background: var(--surface); }
    .form-control-modern:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(31,58,95,0.12); outline: none; }
    .btn-outline-primary-custom { border: 1px solid var(--primary); color: var(--primary); background: var(--surface); border-radius: var(--radius-sm); padding: 0.55rem 1.4rem; font-weight: 600; transition: background-color 0.15s; }
    .btn-outline-primary-custom:hover { background: var(--primary-soft); color: var(--primary); }
    @media (max-width: 575.98px) {
      .sub-step { border-left: 0; padding-left: 0; margin-bottom: 1.25rem; }
      .sub-step-label { padding-bottom: .35rem; border-bottom: 2px solid currentColor; display: inline-block; }
      .feedback-box { padding: .65rem .75rem; }
      .correction-card { padding: .65rem .75rem; }
      .correction-card .cc-original { font-size: .85rem; }
      .form-control-modern { padding: .7rem .8rem; }
    }
  </style>
  <link rel="stylesheet" href="/static/css/ui.css">
</head>
<body>
  <nav class="navbar navbar-custom navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand text-white fw-bold" href="/student">
        <i class="bi bi-arrow-left me-2"></i>返回作業列表
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="attempt-badge d-none" id="attemptBadge"></span>
        <button class="btn btn-outline-light btn-sm" data-action="logout">
          登出
        </button>
      </div>
    </div>
  </nav>

  <div id="toastContainer"></div>

  <div class="container mt-4 mb-5 maxw-860">
    <div id="loadingMsg" class="text-center py-5">
      <div class="spinner-border text-primary spinner-lg"></div>
      <p class="mt-3 text-muted">載入中...</p>
    </div>

    <div id="content" class="d-none">
      <div class="mb-4">
        <h3 id="assignmentTitle" class="fw-bold mb-1"></h3>
        <p id="dueDate" class="text-muted small mb-0"></p>
      </div>
      <div class="progress-steps" id="progressSteps"></div>
      <div id="viewModeBanner" class="d-none mb-3"></div>
      <div id="sectionContainer"></div>
      <div class="section-nav" id="sectionNav"></div>
    </div>
  </div>

  <script>window.CURRENT_SECTION = 2; window.PAGE_PATH = 'writing';</script>
  <script src="/static/student/workflow.js"></script>
  <script src="/static/student/common.js"></script>
  <script src="/static/pwa.js"></script>

</body>
