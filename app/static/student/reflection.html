<!DOCTYPE html>
<html lang="zh-TW"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心得撰寫 - AI 英語面試練習系統</title>
  <link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="AI 英語面試"><meta name="application-name" content="AI 英語面試"><meta name="theme-color" content="#1F3A5F">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous"><link rel="stylesheet" href="/static/student/common.css">
  <style>.question-card{background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}.question-card textarea{min-height:120px}.ai-suggestion-card{background:var(--primary-soft);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius-sm);padding:.9rem 1rem;margin:.75rem 0}.ai-suggestion-card ul{padding-left:1.25rem}.grade-score{font-size:3rem;font-weight:800;color:var(--primary)}.rating-row{border-bottom:1px solid var(--border);padding:.55rem 0}.issue-box{background:var(--warning-soft);border:1px solid #EAD7B5;border-radius:var(--radius);padding:1rem}.rubric-dimension{border-left:3px solid var(--primary);padding:.75rem 1rem;background:var(--surface-soft);margin:.6rem 0}.save-status{display:inline-flex;align-items:center;min-height:38px;font-size:.9rem;color:var(--muted)}.save-status.saving{color:var(--primary)}.save-status.saved{color:var(--success)}.save-status.error{color:var(--warning)}.recovery-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}</style>
  <link rel="stylesheet" href="/static/css/ui.css">
</head><body>
  <nav class="navbar navbar-custom"><div class="container"><a class="navbar-brand text-white fw-bold" href="/student" data-action="returnToAssignments"><i class="bi bi-arrow-left me-2"></i>返回作業列表</a><div class="ms-auto d-flex align-items-center gap-3"><span class="attempt-badge d-none" id="attemptBadge"></span><button class="btn btn-outline-light btn-sm" data-action="logoutFromReflection">登出</button></div></div></nav><div id="toastContainer"></div>
  <main class="container my-4 mb-5 maxw-920"><div id="loadingMsg" class="text-center py-5"><div class="spinner-border text-primary"></div></div><div id="content" class="d-none"><div class="mb-4"><h3 id="assignmentTitle" class="fw-bold mb-1"></h3><p id="dueDate" class="text-muted small mb-0"></p></div><div class="progress-steps" id="progressSteps"></div><div id="viewModeBanner" class="d-none mb-3"></div>
    <section id="reflectionCard" class="section-card active"><div class="section-header"><div><div class="section-title">心得撰寫</div><div class="section-subtitle">Reflection</div></div></div><div class="section-body"><div id="recoveryNotice" class="alert alert-warning d-none" role="alert"></div><form id="reflectionForm"><div id="questionsBox"></div>
      <div class="issue-box mt-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="hasIssue"><label class="form-check-label fw-bold" for="hasIssue">這次練習是否遇到需要回報的問題？</label></div><div id="issueFields" class="d-none mt-3"><label class="form-label" for="issueCategory">問題類別 *</label><select id="issueCategory" class="form-select mb-3"><option value="">請選擇</option><option>系統操作</option><option>錄音或音訊</option><option>AI 回饋內容</option><option>網頁顯示</option><option>其他</option></select><label class="form-label" for="issueDescription">問題說明 *</label><textarea id="issueDescription" class="form-control mb-3" maxlength="3000" rows="4" placeholder="請描述發生時間、操作步驟與看到的狀況。"></textarea><label class="form-label" for="photoInput">上傳照片（選填）</label><input id="photoInput" class="form-control" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif"><div class="form-text">JPEG、PNG、WebP、HEIC/HEIF，最多 10 MB。</div><div id="photoState" class="mt-2"></div></div></div>
      <div id="lockedNotice" class="alert alert-success d-none mt-4"><i class="bi bi-check-circle-fill me-1"></i>心得已正式送出，內容已鎖定。</div><div id="actions" class="d-flex gap-2 flex-wrap align-items-center mt-4"><button type="button" id="draftBtn" class="btn btn-outline-primary" data-action="saveDraftManually"><span id="draftSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>立即儲存</button><button type="button" id="submitBtn" class="btn btn-primary-custom" data-action="submitFinal"><span id="submitSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>正式送出心得</button><span id="saveStatus" class="save-status" aria-live="polite">尚未儲存</span></div>
    </form></div></section>
    <section class="section-card mt-4" id="gradeCard"><div class="section-header"><div><div class="section-title">老師批改結果</div><div class="section-subtitle">僅顯示最新成績版本</div></div></div><div class="section-body" id="gradeBox"><p class="text-muted mb-0">老師尚未完成批改。</p></div></section>
    <details class="section-card mt-4"><summary class="section-body fw-bold cursor-pointer">查看本次作業的評分規準</summary><div class="section-body pt-0" id="rubricBox"></div></details>
    <div class="section-nav"><button class="btn-nav" data-action="navigateSection" data-args='[5]'><i class="bi bi-chevron-left me-1"></i>AI 回饋</button><a class="btn-nav-next" href="/student" data-action="returnToAssignments">返回作業列表</a></div>
  </div></main>
  <script>window.CURRENT_SECTION=6;window.PAGE_PATH='reflection';</script><script src="/static/student/workflow.js"></script><script src="/static/student/common.js"></script><script src="/static/pwa.js"></script><script src="/static/student/practice-runtime.js"></script><script src="/static/student/reflection-draft.js"></script>
  <script type="module" src="/static/student/controllers/reflection.mjs"></script>
</body></html>
