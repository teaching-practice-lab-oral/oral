  <style>
    .feedback-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem 1.25rem; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; }
    .btn-outline-primary-custom { border: 2px solid #4f46e5; color: #4f46e5; background: white; border-radius: 10px; padding: 0.55rem 1.4rem; font-weight: 600; transition: all 0.15s; }
    .btn-outline-primary-custom:hover { background: #4f46e5; color: white; }
    .btn-record { background: linear-gradient(90deg, #ef4444, #dc2626); border: none; color: white; border-radius: 10px; padding: 0.55rem 1.4rem; font-weight: 600; }
    .btn-stop { background: #475569; border: none; color: white; border-radius: 10px; padding: 0.55rem 1.4rem; font-weight: 600; }
    audio { border-radius: 10px; width: 100%; max-width: 500px; }
    .timer-display { font-size: 1.6rem; font-weight: 700; font-family: 'Courier New', monospace; color: #ef4444; }
    .q-block { border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; background: white; }
    .q-block.q-done { border-color: #a7f3d0; background: #f0fdf4; }
    .q-block.q-active { border-color: #c7d2fe; background: #eef2ff; }
    .q-block.q-locked { opacity: 0.5; pointer-events: none; }
    .q-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.35rem; }
    .q-label.done { color: #059669; }
    .q-label.active { color: #4f46e5; }
    .q-label.locked { color: #94a3b8; }
    .q-question { font-weight: 600; font-size: 1rem; color: #1e293b; margin-bottom: 0.9rem; }
    .q-subtitle { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.85rem 1rem; font-size: 1rem; line-height: 1.8; white-space: pre-wrap; letter-spacing: 0.01em; margin-bottom: 1rem; color: #334155; }
    .q-subtitle.sync-ready { cursor: text; }
    .tts-word { appearance: none; border: 0; background: transparent; color: inherit; display: inline; margin: 0; padding: 0.05em 0.08em; border-radius: 0.28rem; font: inherit; line-height: inherit; letter-spacing: inherit; text-align: inherit; transition: background-color 0.12s ease, color 0.12s ease, box-shadow 0.12s ease; }
    .tts-word:hover { background: #e0e7ff; color: #3730a3; }
    .tts-word.is-past { color: #64748b; }
    .tts-word.is-active { background: #4f46e5; color: #fff; box-shadow: 0 0 0 2px rgba(79,70,229,0.16); }
    .tts-word:focus-visible { outline: 3px solid rgba(79,70,229,0.4); outline-offset: 2px; }
    .tts-sync-note { color: #64748b; font-size: 0.78rem; margin: -0.55rem 0 1rem; }
    @media (prefers-reduced-motion: reduce) { .tts-word { transition: none; } }
  </style>
