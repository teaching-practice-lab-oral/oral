  <style>
    .feedback-box { background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; }
    .btn-outline-primary-custom { border: 1px solid var(--primary); color: var(--primary); background: var(--surface); border-radius: var(--radius-sm); padding: 0.55rem 1.4rem; font-weight: 600; transition: background-color 0.15s; }
    .btn-outline-primary-custom:hover { background: var(--primary-soft); color: var(--primary); }
    .btn-record { background: var(--danger); border: 1px solid var(--danger); color: white; border-radius: var(--radius-sm); padding: 0.55rem 1.4rem; font-weight: 600; }
    .btn-record:hover { background: #8F1E18; border-color: #8F1E18; color: white; }
    .btn-stop { background: var(--ink); border: 1px solid var(--ink); color: white; border-radius: var(--radius-sm); padding: 0.55rem 1.4rem; font-weight: 600; }
    .btn-stop:hover { background: #000; color: white; }
    audio { border-radius: var(--radius-sm); width: 100%; max-width: 500px; }
    .timer-display { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--danger); }
    .q-block { border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 1rem; background: var(--surface); }
    .q-block.q-done { border-color: #BFD9C8; }
    .q-block.q-active { border-color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); }
    .q-block.q-locked { opacity: 0.55; pointer-events: none; }
    .q-label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 0.35rem; }
    .q-label.done { color: var(--success); }
    .q-label.active { color: var(--primary); }
    .q-label.locked { color: var(--faint); }
    .q-question { font-weight: 600; font-size: 1rem; color: var(--ink); margin-bottom: 0.9rem; }
    .q-subtitle { background: var(--surface-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.85rem 1rem; font-size: 1.05rem; line-height: 1.8; white-space: pre-wrap; margin-bottom: 1rem; color: var(--ink); }
    .q-subtitle.sync-ready { cursor: text; }
    .tts-word { appearance: none; border: 0; background: transparent; color: inherit; display: inline; margin: 0; padding: 0.05em 0.08em; border-radius: 3px; font: inherit; line-height: inherit; letter-spacing: inherit; text-align: inherit; transition: background-color 0.12s ease, color 0.12s ease; }
    .tts-word:hover { background: var(--primary-soft); color: var(--primary); }
    .tts-word.is-past { color: var(--faint); }
    .tts-word.is-active { background: var(--primary); color: #fff; }
    .tts-word:focus-visible { outline: 3px solid rgba(31,58,95,0.4); outline-offset: 2px; }
    .tts-sync-note { color: var(--muted); font-size: 0.78rem; margin: -0.55rem 0 1rem; }
    @media (max-width: 575.98px) {
      /* Questions become ruled sections instead of nested boxes */
      .q-block { border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 1rem 0; margin-bottom: 0; }
      .q-block:first-child { border-top: 0; padding-top: .25rem; }
      .q-block.q-active { box-shadow: none; }
      .q-question { font-size: .975rem; line-height: 1.45; margin-bottom: .65rem; }
      .q-subtitle { font-size: 1rem; line-height: 1.65; padding: .65rem .75rem; margin-bottom: .75rem; }
      .feedback-box { padding: .75rem .85rem; }
      .timer-display { font-size: 1.35rem; }
      .btn-record, .btn-stop, .btn-outline-primary-custom { padding: .5rem 1rem; }
    }
    @media (prefers-reduced-motion: reduce) { .tts-word { transition: none; } }
  </style>
