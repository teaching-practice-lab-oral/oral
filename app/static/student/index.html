<head>

  <link rel="icon" href="/favicon.ico" sizes="any" />

  <meta property="og:title" content="AI 英語面試練習系統 — 我的作業" />
  <meta property="og:description" content="AI 輔助英語面試練習系統，幫助大學生提升英語面試能力。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/static/favicon.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous"/>
  <link rel="stylesheet" href="/static/student/account-setup.css" />
  <link rel="stylesheet" href="/static/student/common.css" />
  <style>
    .stage-watermark {
      position: fixed; left: 50%; top: 50%; z-index: 0; display: none;
      transform: translate(-50%, -50%) rotate(-12deg);
      color: var(--primary); font-size: clamp(8rem, 25vw, 24rem); font-weight: 800;
      letter-spacing: 0.08em; line-height: 1; opacity: 0.06;
      pointer-events: none; user-select: none; white-space: nowrap;
    }
    .stage-watermark.is-visible { display: block; }

    .page-title { font-size: 1.6rem; font-weight: 700; margin: 0 0 1.5rem; }

    /* Groups */
    .assignment-group + .assignment-group { margin-top: 2rem; }
    .assignment-group-title {
      display: flex; align-items: center; gap: .5rem;
      font-size: 1rem; font-weight: 700; color: var(--ink); margin: 0 0 .75rem;
    }
    .assignment-group-count {
      min-width: 1.6rem; padding: 0 .45rem; border-radius: var(--radius-sm);
      background: #E9ECF0; color: var(--muted); font-size: .78rem; font-weight: 600; text-align: center;
    }
    details.assignment-group-archive > summary { cursor: pointer; list-style: none; padding: .5rem 0; }
    details.assignment-group-archive > summary::-webkit-details-marker { display: none; }
    details.assignment-group-archive > summary::after {
      content: ""; width: .5rem; height: .5rem; margin-left: .25rem;
      border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
      transform: rotate(-45deg); transition: transform .15s;
    }
    details.assignment-group-archive[open] > summary::after { transform: rotate(45deg); }

    /* One bordered list, rows separated by hairlines */
    .assignment-rows { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .assignment-rows-empty { margin: 0; padding: 1.25rem; color: var(--muted); }
    .assignment-row {
      display: grid; grid-template-columns: minmax(0, 1fr) 15rem; gap: 1.5rem;
      padding: 1.25rem 1.5rem; align-items: start;
    }
    .assignment-row + .assignment-row { border-top: 1px solid var(--border); }
    .assignment-title { font-size: 1.1rem; font-weight: 700; color: var(--ink); margin: 0 0 .25rem; line-height: 1.4; }
    .assignment-desc { font-size: .9rem; color: var(--muted); margin: 0 0 .6rem; }
    .assignment-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .9rem; margin-bottom: .6rem; }
    .progress { height: 4px; border-radius: 2px; background: #E9ECF0; max-width: 24rem; }
    .progress-bar { border-radius: 2px; }
    .due-badge { font-size: .82rem; color: var(--muted); }
    .due-badge.overdue { color: var(--danger); }
    .due-badge.late { color: var(--warning); }

    .status-badge {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: .15rem .55rem; border-radius: var(--radius-sm);
      font-size: .78rem; font-weight: 600;
    }
    .status-completed { background: var(--success-soft); color: var(--success); }
    .status-active { background: var(--primary-soft); color: var(--primary); }
    .status-warning, .status-late { background: var(--warning-soft); color: var(--warning); }
    .status-pending { background: #EEF0F3; color: var(--muted); }
    .status-overdue { background: var(--danger-soft); color: var(--danger); }

    /* Actions column */
    .assignment-actions { display: flex; flex-direction: column; gap: .5rem; }
    .btn-start, .btn-retry, .btn-export-result {
      background: var(--primary); border: 1px solid var(--primary); color: #fff;
      font-weight: 600; border-radius: var(--radius-sm); padding: .5rem 1rem;
    }
    .btn-start:hover, .btn-retry:hover:not(:disabled), .btn-export-result:hover:not(:disabled) {
      background: var(--primary-hover); border-color: var(--primary-hover); color: #fff;
    }
    .btn-view {
      background: var(--surface); border: 1px solid var(--primary); color: var(--primary);
      font-weight: 600; border-radius: var(--radius-sm); padding: .5rem 1rem;
    }
    .btn-view:hover:not(:disabled) { background: var(--primary-soft); color: var(--primary); }
    .btn-retry:disabled, .btn-export-result:disabled, .btn-view:disabled {
      background: var(--surface-soft); border-color: var(--border); color: var(--faint); opacity: 1;
    }
    .btn-export-result { background: var(--surface); color: var(--ink); border-color: var(--border); }
    .btn-export-result:hover:not(:disabled) { background: var(--surface-soft); border-color: var(--muted); color: var(--ink); }
    .btn-locked {
      width: 100%; background: var(--surface-soft); border: 1px solid var(--border); color: var(--faint);
      font-weight: 600; border-radius: var(--radius-sm); padding: .5rem 1rem; cursor: not-allowed;
    }
    .completed-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
    .completed-actions .btn { display: flex; align-items: center; justify-content: center; }
    .completed-actions .btn-export-result { grid-column: 1 / -1; }
    .result-export-feedback, .retry-feedback { color: var(--danger); font-size: .78rem; }
    .result-export-feedback.is-success { color: var(--success); }
    .result-export-feedback:empty, .retry-feedback:empty { display: none; }
    .record-actions { display: flex; justify-content: center; gap: 1.25rem; }
    .btn-record {
      background: none; border: 0; padding: .25rem 0; color: var(--primary);
      font-size: .85rem; font-weight: 600; text-decoration: underline; text-underline-offset: .2em;
      text-decoration-color: rgba(31,58,95,.3);
    }
    .btn-record:hover:not(:disabled) { text-decoration-color: var(--primary); }
    .btn-record:disabled { color: var(--faint); text-decoration: none; cursor: not-allowed; }

    @media (max-width: 767.98px) {
      .assignment-row { grid-template-columns: 1fr; gap: 1rem; padding: 1.1rem 1rem; }
      .progress { max-width: none; }
      .btn-start, .btn-view, .btn-retry, .btn-export-result, .btn-locked { min-height: 44px; }
    }

    /* Submission / grade history modal */
    .record-list-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .grade-attempt + .grade-attempt { border-top: 1px solid var(--border); padding-top: 1.25rem; margin-top: 1.25rem; }
    .grade-revision { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .grade-revision + .grade-revision { margin-top: .75rem; }
    .grade-revision summary { cursor: pointer; list-style: none; padding: .85rem 1rem; background: var(--surface-soft); }
    .grade-revision summary::-webkit-details-marker { display: none; }
    .grade-revision[open] summary { border-bottom: 1px solid var(--border); }
    .grade-revision-body { padding: 1rem; }
    .grade-rating { border-bottom: 1px solid #EEF0F3; padding: .5rem 0; }
    .grade-rating:last-child { border-bottom: 0; }

    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
    .empty-state h5 { color: var(--ink); }
  </style>
  <link rel="stylesheet" href="/static/css/ui.css">
</head>
<body>
  <nav class="navbar navbar-custom navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/student">
        <i class="bi bi-mic-fill"></i>
        <span>AI 英語面試練習系統</span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-white d-flex align-items-center gap-1">
          <i class="bi bi-person-circle"></i>
          <span id="userName"></span>
        </span>
        <button class="btn btn-outline-light btn-sm" data-action="openChangePw">
          變更密碼
        </button>
        <button class="btn btn-outline-light btn-sm" data-action="logout">
          登出
        </button>
      </div>
    </div>
  </nav>

  <!-- 變更密碼 Modal -->
  <div class="modal fade" id="changePwModal" tabindex="-1" aria-labelledby="changePwModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header change-pw-header">
          <div class="change-pw-heading">
            <div class="change-pw-icon" aria-hidden="true">
              <i class="bi bi-shield-lock-fill"></i>
            </div>
            <div>
              <div class="change-pw-kicker">帳戶安全與使用者權益</div>
              <h5 class="modal-title fw-bold" id="changePwModalTitle">設定新的登入密碼</h5>
              <p class="change-pw-subtitle" id="changePwSubtitle">定期更新登入密碼，有助於保護您的帳戶與作業資料。</p>
            </div>
          </div>
          <button type="button" class="btn-close" id="changePwClose" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>

        <div class="modal-body">
          <div id="changePwAlert" class="alert d-none" role="alert" aria-live="assertive" tabindex="-1"></div>

          <div id="changePwFirstLoginNote" class="change-pw-note d-none">
            <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
            <div>
              <strong id="changePwSetupTitle">請完成帳戶設定</strong><br>
              <span id="changePwSetupText">請完成必要設定後再繼續使用系統。</span>
            </div>
          </div>

          <div id="changePwLegalDocs" class="mb-3 d-none">
            <div class="change-pw-section-title">使用前請閱讀</div>
            <div class="legal-doc-list">
              <a id="privacyNoticeLink" href="#" target="_blank" rel="noopener noreferrer" class="legal-doc-link">
                <span class="doc-icon"><i class="bi bi-person-vcard"></i></span>
                <span class="doc-text" id="privacyNoticeText">載入隱私權政策…</span>
                <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
              </a>
              <a id="systemTermsLink" href="#" target="_blank" rel="noopener noreferrer" class="legal-doc-link">
                <span class="doc-icon"><i class="bi bi-file-earmark-check"></i></span>
                <span class="doc-text" id="systemTermsText">載入使用者條款…</span>
                <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
              </a>
            </div>
          </div>

          <div id="changePwLegalConsent" class="consent-panel mb-3 d-none">
            <div class="form-check consent-item">
              <input class="form-check-input" type="checkbox" id="privacyAcknowledged" name="privacyAcknowledged">
              <label class="form-check-label" for="privacyAcknowledged">
                我已閱讀並了解「隱私權政策」。
              </label>
            </div>
            <div class="form-check consent-item">
              <input class="form-check-input" type="checkbox" id="termsAccepted" name="termsAccepted">
              <label class="form-check-label" for="termsAccepted" id="systemTermsConsentText">我已閱讀、了解並同意遵守「使用者條款」。</label>
            </div>
          </div>

          <div class="password-group">
            <label class="form-label" for="oldPassword">目前密碼</label>
            <div class="password-field">
              <i class="bi bi-key field-icon" aria-hidden="true"></i>
              <input type="password" class="form-control" id="oldPassword" maxlength="256" placeholder="輸入目前使用的密碼" autocomplete="off" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
              <button type="button" class="password-toggle" data-password-target="oldPassword" aria-label="顯示密碼">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="password-group">
            <label class="form-label" for="newPassword">新密碼</label>
            <div class="password-field">
              <i class="bi bi-lock field-icon" aria-hidden="true"></i>
              <input type="password" class="form-control" id="newPassword" minlength="8" maxlength="128" placeholder="輸入至少 8 個字元" autocomplete="new-password" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
              <button type="button" class="password-toggle" data-password-target="newPassword" aria-label="顯示密碼">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="password-hint">請勿使用與舊密碼相同的組合。</div>
          </div>

          <div class="password-group">
            <label class="form-label" for="confirmPassword">再次確認新密碼</label>
            <div class="password-field">
              <i class="bi bi-shield-check field-icon" aria-hidden="true"></i>
              <input type="password" class="form-control" id="confirmPassword" minlength="8" maxlength="128" placeholder="再次輸入新密碼" autocomplete="new-password" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
              <button type="button" class="password-toggle" data-password-target="confirmPassword" aria-label="顯示密碼">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="modal-footer border-0">
          <button class="btn btn-light" id="changePwCancelBtn" data-bs-dismiss="modal">稍後再說</button>
          <button class="btn btn-primary" id="changePwSubmitBtn" data-action="doChangePassword">
            <i class="bi bi-check2-circle me-1"></i>儲存新密碼
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 提交紀錄／成績共用 Modal -->
  <div class="modal fade" id="assignmentRecordsModal" tabindex="-1" aria-labelledby="assignmentRecordsModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="assignmentRecordsModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body" id="assignmentRecordsModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <h1 class="page-title">我的作業</h1>

    <div id="loadingMsg" class="text-center py-5">
      <div class="spinner-border text-secondary"></div>
      <p class="mt-2 text-muted">載入作業中...</p>
    </div>

    <div id="emptyMsg" class="empty-state d-none">
      <h5>目前沒有開放中的作業</h5>
      <p class="text-muted small">請等待教師開放作業後再回來查看。</p>
    </div>

    <div id="assignmentList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="/static/pwa.js"></script>
  <script src="/static/student/workflow.js"></script>
  <script type="module" src="/static/student/controllers/index.mjs"></script>
  <script type="module" src="/static/student/controllers/index-page.mjs"></script>

<div id="stageWatermark" class="stage-watermark" aria-hidden="true">Stage</div>
<script>
  if (window.location.hostname.startsWith('dev-')) {
    document.getElementById('stageWatermark').classList.add('is-visible');
  }
</script>
<footer class="site-footer">AI 英語面試練習系統 · Apache-2.0</footer>

</body>
