<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>批改中心 - AI 英語面試練習系統管理後台</title>
  <meta name="description" content="依作業查看待批改學生並快速進入批改流程" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous"/>
  <link rel="stylesheet" href="/static/admin/css/common.css" />
  <style>
    .grading-card { height: 100%; display: flex; flex-direction: column; }
    .grading-card .card-body { flex: 1; }
    .pending-count { font-size: 1.8rem; line-height: 1; font-weight: 800; color: var(--admin-primary); }
    .pending-count.is-clear { color: #0f9f6e; }
    .grading-card .btn { box-shadow: 0 3px 10px rgba(31, 58, 95, .14); }
    .queue-status-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-top:1rem; }
    .queue-status { border:1px solid var(--admin-border);border-radius: var(--admin-radius-sm);background:var(--admin-surface-soft);padding:.5rem .55rem;text-align:center; }
    .queue-status strong { display:block;color:var(--admin-ink);font-size:1rem; }
    .queue-status span { color:var(--admin-muted);font-size:.72rem;white-space:nowrap; }
    .queue-status.needs-help { border-color:#f2b8bf;background:#fff5f6; }
    .queue-status.needs-help strong,.queue-status.needs-help span { color:#a6323e; }
    @media(max-width:420px){.queue-status-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
  <link rel="stylesheet" href="/static/css/ui.css">
</head>
<body>
  <nav class="navbar navbar-admin navbar-expand-lg"></nav>
  <div id="toastContainer"></div>

  <main class="container-fluid px-4 py-4 admin-page">
    <div class="d-flex align-items-center gap-3 mb-4 flex-wrap admin-page-header">
      <div>
        <h1 class="fw-bold fs-5 mb-1"><i class="bi bi-clipboard-check me-2 text-primary"></i>批改中心</h1>
        <p class="text-muted small mb-0">先選擇作業，再直接進入待批改名單。</p>
      </div>
      <a class="btn btn-outline-secondary ms-auto" href="/admin/assignments">
        <i class="bi bi-journal-text me-1"></i><span class="button-label-nudge">作業設定</span>
      </a>
    </div>

    <div id="loadingState" class="panel text-center py-5">
      <div class="spinner-border text-primary spinner-border-sm me-2"></div>正在整理批改名單…
    </div>
    <div id="errorState" class="alert alert-danger d-none" role="alert"></div>
    <div id="emptyState" class="admin-empty-state text-center py-5 d-none">
      <i class="bi bi-inbox fs-1 opacity-25 d-block mb-3"></i>
      <strong class="d-block mb-1">目前沒有可批改的作業</strong>
      請先到「作業」建立或啟用作業。
    </div>
    <div id="gradingGrid" class="row g-4 d-none"></div>
  </main>

  <script src="/static/admin/js/common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script type="module" src="/static/admin/controllers/grading.mjs"></script>
</body>
</html>
