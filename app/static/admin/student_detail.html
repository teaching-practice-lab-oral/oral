<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學生作業詳情 - AI 英語面試練習系統管理後台</title>
  <meta name="description" content="檢視個別學生的作業內容與 AI 評語" />
  <meta property="og:title" content="學生作業詳情 - AI 英語面試練習系統" />
  <meta property="og:description" content="檢視個別學生的作業內容與 AI 評語" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/static/favicon.svg" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
  crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD"
  crossorigin="anonymous" />
  <link rel="stylesheet" href="/static/admin/css/common.css?v=3" />
  <style>
    .info-card {
      background: white;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.25rem 1.5rem;
    }
    .stage-card {
      background: white;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .stage-header {
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    details.stage-card > summary.stage-header { cursor: pointer; list-style: none; border-bottom: 0; }
    details.stage-card > summary.stage-header::-webkit-details-marker { display: none; }
    details.stage-card[open] > summary.stage-header { border-bottom: 1px solid #e2e8f0; }
    .stage-toggle-text::after { content: '展開查看'; }
    details.stage-card[open] .stage-toggle-text::after { content: '收合'; }
    .stage-toggle-icon { transition: transform .18s ease; }
    details.stage-card[open] .stage-toggle-icon { transform: rotate(180deg); }
    .stage-num {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #4f46e5;
      color: white;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .stage-num.completed { background: #10b981; }
    .stage-title { font-weight: 700; font-size: 0.95rem; color: #1e293b; }
    .stage-body { padding: 1.25rem; }

    /* Grammar correction card */
    .correction-card {
      border-radius: 10px;
      border: 1px solid #fecaca;
      background: #fff5f5;
      padding: 0.85rem 1rem;
      margin-bottom: 0.75rem;
    }
    .correction-card .original { color: #dc2626; font-style: italic; margin-bottom: 0.4rem; }
    .correction-card .corrected { color: #065f46; font-weight: 600; margin-bottom: 0.4rem; }
    .correction-card .explanation { color: #475569; font-size: 0.85rem; }

    .feedback-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1rem 1.25rem;
    }
    .polished-box { border-left: 3px solid #4f46e5; padding: 0.8rem 1rem; background: #eef2ff; border-radius: 0 12px 12px 0; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 0.88rem; }

    .analysis-item { padding: 0.6rem 0; border-bottom: 1px solid #f1f5f9; font-size: 0.88rem; }
    .analysis-item:last-child { border-bottom: none; }
    .analysis-label { font-weight: 700; color: #475569; font-size: 0.8rem; margin-bottom: 0.2rem; }

    /* Prev/next navigation bar */
    .nav-bar {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 0.55rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .breadcrumb-link { font-size: 0.82rem; color: #4f46e5; text-decoration: none; }
    .breadcrumb-link:hover { text-decoration: underline; }
    .breadcrumb-sep { color: #cbd5e1; font-size: 0.75rem; }
    .breadcrumb-current { font-size: 0.82rem; color: #1e293b; font-weight: 600; }
    .nav-counter { font-size: 0.8rem; color: #64748b; background: #f1f5f9;
      padding: 0.18rem 0.6rem; border-radius: 20px; flex-shrink: 0; }
    .btn-nav { font-size: 0.82rem; padding: 0.28rem 0.7rem; border-radius: 8px;
      white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
    .keyboard-hint { font-size: 0.72rem; color: #94a3b8; flex-shrink: 0; }
    .grading-panel { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow:auto; }
    .criterion-grade { border-bottom:1px solid #e2e8f0; padding:.7rem 0; }
    .criterion-grade:last-child { border-bottom:0; }
    .score-display { font-size:2rem; font-weight:800; color:#4f46e5; }
    .proctor-timeline { border-left:2px solid #cbd5e1; margin-left:.45rem; padding-left:1rem; }
    .proctor-event { position:relative; padding:.15rem 0 .9rem; }
    .proctor-event::before { content:''; position:absolute; width:.62rem; height:.62rem; border-radius:50%; background:#f59e0b; left:-1.37rem; top:.42rem; }
    .proctor-event.proctor-ok::before { background:#10b981; }
    @media (max-width:1199px) { .grading-panel { position:static; max-height:none; } }
  </style>
</head>
<body>
  <nav class="navbar navbar-admin navbar-expand-lg"></nav>
  <div id="toastContainer"></div>

  <div class="container-fluid px-4 py-4">
    <!-- Breadcrumb + prev/next navigation (hidden until initNavigation() runs) -->
    <div id="navBar" class="nav-bar d-none">
      <a href="/admin" class="breadcrumb-link">後台</a>
      <span class="breadcrumb-sep">/</span>
      <a id="breadcrumbAssignment" href="/admin/assignments" class="breadcrumb-link">作業</a>
      <span class="breadcrumb-sep">/</span>
      <a id="breadcrumbResults" href="#" class="breadcrumb-link">學生作業總覽</a>
      <span class="breadcrumb-sep">/</span>
      <span id="breadcrumbStudent" class="breadcrumb-current">—</span>

      <span id="navCounter" class="nav-counter ms-2">— / —</span>

      <div class="d-flex gap-2 ms-1" id="navButtons">
        <button id="btnPrev" class="btn btn-outline-secondary btn-nav" data-action="navigatePrev" disabled>
          <i class="bi bi-chevron-left me-1"></i><span id="prevLabel">上一位</span>
        </button>
        <button id="btnNext" class="btn btn-outline-primary btn-nav" data-action="navigateNext" disabled>
          <span id="nextLabel">下一位</span><i class="bi bi-chevron-right ms-1"></i>
        </button>
      </div>

      <span class="keyboard-hint d-none d-lg-block ms-auto">
        <i class="bi bi-keyboard me-1"></i>← → 換學生
      </span>
    </div>

    <div class="d-flex align-items-center gap-3 mb-4 flex-wrap admin-page-header">
      <button class="btn btn-outline-secondary" data-action="goBack">
        <i class="bi bi-arrow-left me-1"></i>返回
      </button>
      <div>
        <h1 class="fw-bold fs-5 mb-1" id="pageTitle">
          <i class="bi bi-person-lines-fill me-2 text-primary"></i>學生詳情
        </h1>
        <p class="text-muted small mb-0">左側核對學習歷程，右側依評分規準完成批改。</p>
      </div>
      <div class="ms-auto d-flex gap-2 flex-wrap admin-page-actions">
        <button class="btn btn-warning" data-action="allowRetake">
          <i class="bi bi-arrow-repeat me-1"></i>允許重作
        </button>
        <button class="btn btn-outline-info" data-action="openLateDeadlineModal">
          <i class="bi bi-calendar-plus me-1"></i>補繳設定
        </button>
      </div>
    </div>

    <div id="loadingMsg" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="text-muted mt-2">載入中...</p>
    </div>

    <div id="content" class="d-none">
      <!-- 學生資訊 -->
      <div class="info-card mb-3">
        <div class="d-flex flex-wrap gap-4 align-items-center">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-person-badge text-primary"></i>
            <span class="text-muted small">學號</span>
            <code id="infoStudentId" class="ms-1"></code>
          </div>
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-person text-primary"></i>
            <span class="text-muted small">姓名</span>
            <strong id="infoName" class="ms-1"></strong>
          </div>
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-envelope text-primary"></i>
            <span class="text-muted small">電子郵件</span>
            <span id="infoEmail" class="ms-1"></span>
          </div>
        </div>
      </div>

      <!-- 嘗試次數選擇 + 匯出 -->
      <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
        <label class="fw-semibold small text-muted mb-0">嘗試次數：</label>
        <select class="form-select w-auto" id="attemptSelector" data-action-change="renderAttempt"></select>
        <span class="text-muted small" id="attemptStatus"></span>
        <div class="ms-auto d-flex gap-2" id="exportButtons" style="display:none!important;"></div>
      </div>

      <div class="grading-workflow-hint mb-3" role="note">
        <i class="bi bi-check2-square" aria-hidden="true"></i>
        <div><strong>建議批改順序</strong><span>先確認本次作答與 AI 回饋，再依右側規準評分並留下可執行的改進建議。</span></div>
      </div>

      <div class="row g-4">
        <div class="col-xl-7"><div id="submissionContent"></div></div>
        <aside class="col-xl-5 grading-workspace" aria-label="批改面板"><div id="gradingPanel" class="info-card grading-panel"><div class="text-muted text-center py-4">選擇嘗試後載入批改面板</div></div></aside>
      </div>
    </div>
  </div>

  <script src="/static/admin/js/common.js?v=8"></script>
  <script src="/static/admin/js/date-time-picker.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
  crossorigin="anonymous"></script>
  <script type="module" src="/static/admin/controllers/student-detail.mjs?v=6"></script>

  <!-- 補繳設定 Modal -->
  <div class="modal fade" id="lateDeadlineModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width:420px">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title fw-bold"><i class="bi bi-calendar-plus me-2 text-info"></i>補繳設定</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">設定允許該學生補繳的截止日期，逾期後將恢復為唯讀狀態。留空可清除補繳設定。</p>
          <div class="mb-3">
            <label class="form-label fw-semibold small">補繳截止日期</label>
            <input type="hidden" id="lateDeadlineDate" />
          </div>
          <div class="mb-2">
            <label class="form-label fw-semibold small">管理員密碼</label>
            <input type="password" class="form-control" id="lateDeadlinePassword" maxlength="256" placeholder="輸入密碼" autocomplete="off" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true">
          </div>
          <div id="lateDeadlineError" class="text-danger small d-none"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-light" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-info text-white" id="btnConfirmLateDeadline" data-action="confirmLateDeadline">確認設定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 允許重作密碼確認 Modal -->
  <div class="modal fade" id="retakeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width:400px">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title fw-bold"><i class="bi bi-arrow-repeat me-2 text-warning"></i>允許重作</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">請輸入管理員密碼以確認允許該學生重新作答。</p>
          <div class="mb-2">
            <label class="form-label fw-semibold small">管理員密碼</label>
            <input type="password" class="form-control" id="retakePassword" maxlength="256"
              placeholder="輸入密碼" autocomplete="off" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-action-keydown="onEnterConfirmRetake">
          </div>
          <div id="retakeError" class="text-danger small d-none"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-light" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-warning" id="btnConfirmRetake" data-action="confirmRetake">確認允許重作</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
