<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系統總覽 - AI 英語面試練習系統管理後台</title>
  <meta name="description" content="查看學生使用統計與作業狀態" />
  <meta property="og:title" content="系統總覽 - AI 英語面試練習系統" />
  <meta property="og:description" content="查看學生使用統計與作業狀態" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/static/favicon.svg" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous"/>
  <link rel="stylesheet" href="/static/admin/css/common.css" />
  <style>
    .stat-strip {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      background: var(--admin-surface); border: 1px solid var(--admin-border); border-radius: var(--admin-radius);
    }
    .stat-item { padding: 1.1rem 1.4rem; }
    .stat-item + .stat-item { border-left: 1px solid var(--admin-border); }
    .stat-value { font-size: 1.9rem; font-weight: 750; line-height: 1.1; color: var(--admin-ink); font-variant-numeric: tabular-nums; }
    .stat-label { font-size: .82rem; color: var(--admin-muted); margin-top: .25rem; }
    @media (max-width: 991.98px) {
      .stat-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .stat-item:nth-child(4) { border-left: 0; }
      .stat-item:nth-child(n+4) { border-top: 1px solid var(--admin-border); }
    }
    @media (max-width: 575.98px) {
      .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat-item { padding: .85rem 1rem; }
      .stat-item:nth-child(4) { border-left: 1px solid var(--admin-border); }
      .stat-item:nth-child(odd) { border-left: 0; }
      .stat-item:nth-child(n+3) { border-top: 1px solid var(--admin-border); }
    }
  </style>
  <link rel="stylesheet" href="/static/css/ui.css">
</head>
<body>
  <nav class="navbar navbar-admin navbar-expand-lg"></nav>
  <div id="toastContainer"></div>

  <div class="container-fluid px-4 py-4">
    <h5 class="fw-bold mb-4 text-slate-700">
      <i class="bi bi-speedometer2 me-2 text-primary"></i>系統總覽
    </h5>

    <div class="stat-strip mb-4">
      <div class="stat-item"><div class="stat-value" id="statStudents">-</div><div class="stat-label">學生總數</div></div>
      <div class="stat-item"><div class="stat-value" id="statAssignments">-</div><div class="stat-label">作業數</div></div>
      <div class="stat-item"><div class="stat-value" id="statSubmissions">-</div><div class="stat-label">提交記錄</div></div>
      <div class="stat-item"><div class="stat-value" id="statCompleted">-</div><div class="stat-label">已完成</div></div>
      <div class="stat-item"><div class="stat-value" id="statApiToday">-</div><div class="stat-label">今日 API 用量</div></div>
    </div>

    <div class="row g-3">
      <div class="col-12">
        <div class="section-card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-journal-text me-2 text-muted"></i>作業列表</span>
            <a href="/admin/assignments" class="btn btn-outline-secondary btn-sm">管理作業</a>
          </div>
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr><th class="ps-3">標題</th><th>截止</th><th>狀態</th><th></th></tr>
              </thead>
              <tbody id="assignmentList">
                <tr><td colspan="4" class="text-center text-muted py-4">
                  <div class="spinner-border spinner-border-sm me-2"></div>載入中...
                </td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/admin/js/common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script>
    async function loadDashboard() {
      await window._adminReady; // wait for refresh so the rotated session hash is valid
      const [statsRes, assignRes] = await Promise.all([
        fetch('/api/admin/dashboard', { headers: authHeaders() }),
        fetch('/api/admin/assignments', { headers: authHeaders() }),
      ]);

      if (statsRes.status === 401 || statsRes.status === 403) { let m='登入逾期，請重新登入。'; try{const e=await statsRes.clone().json();if(e.detail)m=e.detail;}catch(_){} redirectAdminToLogin(m); return; }
      if (!statsRes.ok) {
        let m = '載入儀表板失敗，請稍後再試。';
        try { const e = await statsRes.clone().json(); if (e.detail) m = e.detail; } catch (_) {}
        showAlert(m);
        return;
      }

      const stats = await statsRes.json();
      document.getElementById('statStudents').textContent = stats.total_students;
      document.getElementById('statAssignments').textContent = stats.total_assignments;
      document.getElementById('statSubmissions').textContent = stats.total_submissions;
      document.getElementById('statCompleted').textContent = stats.completed_submissions;
      document.getElementById('statApiToday').textContent = stats.today_api_calls;

      const atbody = document.getElementById('assignmentList');
      if (assignRes.status === 401 || assignRes.status === 403) { let m='登入逾期，請重新登入。'; try{const e=await assignRes.clone().json();if(e.detail)m=e.detail;}catch(_){} redirectAdminToLogin(m); return; }
      if (!assignRes.ok) {
        let m = '載入近期作業失敗，請稍後再試。';
        try { const e = await assignRes.clone().json(); if (e.detail) m = e.detail; } catch (_) {}
        showAlert(m);
        atbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-3">載入作業失敗</td></tr>';
        return;
      }
      const assignments = await assignRes.json();
      if (!Array.isArray(assignments)) {
        showAlert('近期作業資料格式錯誤，請重新整理後再試。');
        atbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-3">資料格式錯誤</td></tr>';
        return;
      }
      if (assignments.length) {
        const now = new Date();
        atbody.innerHTML = assignments.slice(0,10).map(a => {
          const overdue = a.is_active && a.due_date && now > new Date(a.due_date);
          const stCls = !a.is_active ? 'bg-secondary' : overdue ? 'bg-danger' : 'bg-success';
          const stTxt = !a.is_active ? '已關閉' : overdue ? '已截止' : '開放中';
          return `
          <tr>
            <td class="ps-3 fw-semibold">${escHtml(a.title)}</td>
            <td class="small text-muted">${a.due_date ? new Date(a.due_date).toLocaleDateString('zh-TW') : '—'}</td>
            <td><span class="badge ${stCls}">${stTxt}</span></td>
            <td class="text-end pe-3"><a href="/admin/assignments/${a.id}/results" class="row-action-link">查看學生作業</a></td>
          </tr>`;
        }).join('');
      } else {
        atbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">尚無作業</td></tr>';
      }
    }

    loadDashboard();
  </script>

<footer class="site-footer">AI 英語面試練習系統 · Apache-2.0</footer>
</body>
</html>
