<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作業管理 - AI 英語面試練習系統管理後台</title>
  <meta name="description" content="建立與管理英語面試練習作業" />
  <meta property="og:title" content="作業管理 - AI 英語面試練習系統" />
  <meta property="og:description" content="建立與管理英語面試練習作業" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/static/favicon.svg" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
  crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD"
  crossorigin="anonymous" />
  <link rel="stylesheet" href="/static/admin/css/common.css?v=3" />
  <style>
    .assignment-card {
      background: white;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .assignment-card .card-header {
      background: white;
      border-bottom: 1px solid #f1f5f9;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .assignment-card .card-body { padding: 1.25rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-admin navbar-expand-lg"></nav>
  <div id="toastContainer"></div>

  <div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h5 class="fw-bold mb-0"><i class="bi bi-journal-text me-2 text-primary"></i>作業管理</h5>
      <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-outline-primary" href="/admin/rubrics" id="btnRubricManagement">
          <i class="bi bi-ui-checks-grid me-1"></i>評分規準管理
        </a>
        <button class="btn btn-outline-secondary" id="btnSeedPresets" data-action="seedPresets">
          <i class="bi bi-stars me-1"></i>建立預設五套作業
        </button>
        <button class="btn btn-outline-warning" id="btnSendReminders" data-action="sendDueReminders"
                title="對 72 小時內截止、尚未完成的學生寄送提醒信">
          <i class="bi bi-alarm me-1"></i>寄送截止提醒
        </button>
        <a class="btn btn-primary" href="/admin/create-assignment">
          <i class="bi bi-plus-lg me-1"></i>新增作業
        </a>
      </div>
    </div>

    <div id="assignmentContainer"></div>
  </div>

  <!-- 初始化作業確認 Modal -->
  <div class="modal fade" id="resetAssignmentModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-warning"><i class="bi bi-arrow-counterclockwise me-2"></i>初始化作業</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-2">
          <div id="resetAssignmentAlert" class="alert d-none"></div>
          <div class="alert alert-warning border-0 py-2 small mb-3">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            即將清除作業：<strong id="resetAssignmentTitle"></strong><br>
            所有學生提交紀錄將被刪除，此操作<strong>無法復原</strong>。
          </div>
          <label class="form-label fw-semibold">請輸入您的管理員密碼以確認</label>
          <input type="password" class="form-control" id="resetAssignmentPassword" maxlength="256" placeholder="管理員密碼" autocomplete="off" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-light" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-warning" data-action="confirmResetAssignment">
            <i class="bi bi-arrow-counterclockwise me-1"></i>確認初始化
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 刪除作業確認 Modal -->
  <div class="modal fade" id="deleteAssignmentModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-danger"><i class="bi bi-trash me-2"></i>刪除作業</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-2">
          <div id="deleteAssignmentAlert" class="alert d-none"></div>
          <div class="alert alert-danger border-0 py-2 small mb-3">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            即將刪除作業：<strong id="deleteAssignmentTitle"></strong><br>
            此操作<strong>無法復原</strong>，所有相關學生提交紀錄將一併刪除。
          </div>
          <label class="form-label fw-semibold">請輸入您的管理員密碼以確認</label>
          <input type="password" class="form-control" id="deleteAssignmentPassword" maxlength="256" placeholder="管理員密碼" autocomplete="off" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-light" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-danger" data-action="confirmDeleteAssignment">
            <i class="bi bi-trash me-1"></i>確認刪除
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/admin/js/common.js?v=8"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
  crossorigin="anonymous"></script>
  <script type="module" src="/static/admin/controllers/assignments.mjs?v=4"></script>

</body>
</html>
