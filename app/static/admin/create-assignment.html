<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>建立作業 - AI 英語面試練習系統管理後台</title>
  <meta name="description" content="新增英語面試練習作業" />
  <meta property="og:title" content="建立作業 - AI 英語面試練習系統" />
  <meta property="og:description" content="新增英語面試練習作業" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/static/favicon.svg" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous"/>
  <link rel="stylesheet" href="/static/admin/css/common.css" />
  <style>
    /* Step indicator */
    .wizard-steps { display: flex; align-items: center; gap: 0; margin-bottom: 2rem; }
    .step-item { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
    .step-item:not(:last-child)::after {
      content: ''; position: absolute; top: 18px; left: calc(50% + 18px);
      width: calc(100% - 36px); height: 2px; background: #e2e8f0; z-index: 0;
    }
    .step-item.done::after { background: #1F3A5F; }
    .step-circle {
      width: 36px; height: 36px; border-radius: 50%; border: 2px solid #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; color: #94a3b8; background: white;
      position: relative; z-index: 1; transition: all 0.25s;
    }
    .step-item.active .step-circle { border-color: #1F3A5F; background: #1F3A5F; color: white; }
    .step-item.done .step-circle { border-color: #1F3A5F; background: #1F3A5F; color: white; }
    .step-label { font-size: 0.75rem; color: #94a3b8; margin-top: 0.35rem; text-align: center; }
    .step-item.active .step-label, .step-item.done .step-label { color: #1F3A5F; font-weight: 600; }

    /* Summary */
    .summary-row { display: flex; gap: 1rem; margin-bottom: 0.75rem; }
    .summary-label { font-size: 0.82rem; color: #64748b; min-width: 100px; flex-shrink: 0; }
    .summary-value { font-size: 0.88rem; color: #1e293b; font-weight: 500; }
  </style>
  <link rel="stylesheet" href="/static/css/ui.css">
</head>
<body>
  <nav class="navbar navbar-admin navbar-expand-lg"></nav>
  <div id="toastContainer"></div>

  <div class="container py-4 maxw-820">
    <div class="d-flex align-items-center gap-3 mb-4">
      <a href="/admin/assignments" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>返回作業列表
      </a>
      <h5 class="fw-bold mb-0"><i class="bi bi-magic me-2 text-primary"></i>進階建立作業</h5>
    </div>

    <!-- Step Indicator -->
    <div class="wizard-steps mb-4">
      <div class="step-item active" id="step-ind-1">
        <div class="step-circle" id="step-circle-1">1</div>
        <div class="step-label">基本設定</div>
      </div>
      <div class="step-item" id="step-ind-2">
        <div class="step-circle" id="step-circle-2">2</div>
        <div class="step-label">評分設定</div>
      </div>
      <div class="step-item" id="step-ind-3">
        <div class="step-circle" id="step-circle-3">3</div>
        <div class="step-label">確認送出</div>
      </div>
    </div>

    <!-- ── STEP 1: 基本設定 ── -->
    <div id="step1" class="panel">
      <h6 class="fw-bold mb-3">基本設定</h6>
      <div id="step1Alert" class="alert d-none mb-3"></div>

      <div class="mb-3">
        <label class="form-label fw-semibold">標題 <span class="text-danger">*</span></label>
        <input class="form-control" id="s2Title" maxlength="256" placeholder="例：自我介紹英語面試練習" />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">說明</label>
        <textarea class="form-control" id="s2Desc" rows="2" maxlength="4000" placeholder="作業說明（可留空）"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">AI 情境主題說明 <span class="text-muted small fw-normal">（English，供 AI 了解面試情境）</span></label>
        <textarea class="form-control" id="s2Context" rows="2" maxlength="3000" placeholder="e.g. Personal background, self-introduction, motivation for applying, strengths and weaknesses"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">
          寫作、跟讀與角色扮演核心題意
          <span class="badge bg-primary ms-1">核心 4 題</span>
        </label>
        <div class="form-text mb-3">寫作與跟讀使用原題；角色扮演第 1～4 題由 AI 保留題意自然改問，第 5 題則依學生內容個人化追問。</div>
        <select class="form-select" id="s2QuestionSet" data-action-change="updateQuestionSetUI">
          <option value="">載入公版題組中...</option>
        </select>
        <div class="form-text text-muted">公版題組可直接啟用；學生會依自己填寫的職位、工作內容與職能作答。</div>
        <div id="s2QuestionPreview" class="bg-light border rounded p-3 mt-3"></div>
        <div class="d-flex flex-column gap-2 mt-3 d-none" id="s2CustomQuestions">
          <div class="input-group"><span class="input-group-text text-muted input-addon-narrow">Q1</span><input class="form-control" id="s2Q0" maxlength="500" placeholder="第 1 題英文題目" /></div>
          <div class="input-group"><span class="input-group-text text-muted input-addon-narrow">Q2</span><input class="form-control" id="s2Q1" maxlength="500" placeholder="第 2 題英文題目" /></div>
          <div class="input-group"><span class="input-group-text text-muted input-addon-narrow">Q3</span><input class="form-control" id="s2Q2" maxlength="500" placeholder="第 3 題英文題目" /></div>
          <div class="input-group"><span class="input-group-text text-muted input-addon-narrow">Q4</span><input class="form-control" id="s2Q3" maxlength="500" placeholder="第 4 題英文題目" /></div>
          <div class="form-text text-muted">自訂模式必須填寫全部 4 題。</div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">指定班級 <span class="text-muted small fw-normal">（留空則開放全部學生）</span></label>
        <div id="s2ClassWrap" class="tags-input-wrap border rounded p-2 d-flex flex-wrap gap-1 align-items-center tags-input-box" data-action="focusTagInput" data-args='["s2ClassInput"]'>
          <input id="s2ClassInput" class="border-0 flex-grow-1 tags-input-field" maxlength="64" placeholder="輸入課號後按 Enter 新增" data-action-keydown="handleTagKeyH" data-args='["s2ClassWrap","s2ClassInput"]' autocomplete="off" readonly data-action-focus="clearReadonlyAttr" />
        </div>
        <div id="s2ClassHint" class="form-text text-muted mt-1"></div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">開放日期</label>
          <input type="hidden" id="s2StartDate" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">截止日期</label>
          <input type="hidden" id="s2DueDate" />
        </div>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="s2IsActive" checked />
        <label class="form-check-label">立即啟用</label>
      </div>

      <div class="d-flex justify-content-end mt-4">
        <button class="btn btn-primary px-4" data-action="validateStep1">下一步：評分設定 <i class="bi bi-arrow-right ms-1"></i></button>
      </div>
    </div>

    <!-- ── STEP 2: 評分設定 ── -->
    <div id="step2" class="panel d-none">
      <h6 class="fw-bold mb-3">評分設定</h6>
      <p class="text-muted small mb-4">AI 練習與角色扮演使用系統統一規則；老師只需選擇正式批改使用的評分規準。</p>

      <div class="mb-4">
        <label class="form-label fw-semibold"><i class="bi bi-ui-checks-grid me-1 text-primary"></i>批改用評分規準</label>
        <select class="form-select" id="rubricSelect" required></select>
        <div class="form-text text-muted">學生開始作答時會固定此版本；之後更換只影響新的嘗試。</div>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-outline-secondary" data-action="goStep" data-args='[1]'><i class="bi bi-arrow-left me-1"></i>上一步</button>
        <button class="btn btn-primary px-4" data-action="goStep" data-args='[3]'>下一步：確認送出 <i class="bi bi-arrow-right ms-1"></i></button>
      </div>
    </div>

    <!-- ── STEP 3: 確認送出 ── -->
    <div id="step3" class="panel d-none">
      <h6 class="fw-bold mb-3">確認作業設定</h6>
      <div id="step3Alert" class="alert d-none mb-3"></div>
      <div id="summaryContent" class="mb-4"></div>
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-outline-secondary" data-action="goStep" data-args='[2]'><i class="bi bi-arrow-left me-1"></i>上一步</button>
        <button class="btn btn-success px-4" id="submitBtn" data-action="submitAssignment">
          <i class="bi bi-check-circle me-1"></i>建立作業
        </button>
      </div>
    </div>
  </div>

  <script src="/static/admin/js/common.js"></script>
  <script src="/static/admin/js/date-time-picker.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script type="module" src="/static/admin/controllers/create-assignment.mjs"></script>

</body>
</html>
