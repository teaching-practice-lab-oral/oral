<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重設密碼 - AI 英語面試練習系統</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI 英語面試" />
  <meta name="application-name" content="AI 英語面試" />
  <meta name="theme-color" content="#1F3A5F" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous"/>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="/static/pwa.js" defer></script>
  <style>
    body { min-height:100vh; background:#F5F6F8; color:#1F2328; display:flex; align-items:center; justify-content:center; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
    .reset-wrap { width:100%; max-width:500px; padding:1rem; }
    .reset-card { background:#fff; border:1px solid #DDE1E7; border-radius:8px; overflow:hidden; }
    .reset-header { background:#fff; padding:1.75rem 2rem 1.25rem; text-align:center; color:#1F2328; border-top:4px solid #1F3A5F; border-bottom:1px solid #DDE1E7; }
    .reset-header h1 { font-size:1.35rem; font-weight:700; margin:0; }
    .reset-body { padding:2rem; }
    .form-control { border-color:#DDE1E7; border-radius:6px; }
    .form-control:focus { box-shadow:0 0 0 3px rgba(31,58,95,.12); border-color:#1F3A5F; }
    .btn-reset { background:#1F3A5F; border:1px solid #1F3A5F; color:#fff; font-weight:600; padding:.7rem; border-radius:6px; }
    .btn-reset:hover { background:#172C48; color:#fff; }
    .reset-body a { color:#1F3A5F; }
    .cf-turnstile { display:flex; justify-content:center; margin-bottom:1rem; }
  </style>
  <link rel="stylesheet" href="/static/css/ui.css">
</head>
<body>
  <main class="reset-wrap">
    <div class="reset-card">
      <header class="reset-header">
        <h1 id="pageTitle">申請重設密碼</h1>
      </header>
      <div class="reset-body">
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="requestForm">
          <p class="text-muted small">請輸入與系統相符的學生資料。若系統已登記備用信箱，可一併填寫確認。</p>
          <div class="mb-3">
            <label for="courseNum" class="form-label fw-semibold">課號</label>
            <input id="courseNum" class="form-control" maxlength="64" required autocomplete="off" />
          </div>
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">姓名</label>
            <input id="name" class="form-control" maxlength="128" required autocomplete="name" />
          </div>
          <div class="mb-3">
            <label for="studentId" class="form-label fw-semibold">學號</label>
            <input id="studentId" class="form-control" maxlength="64" required autocomplete="off" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
          </div>
          <div class="mb-3">
            <label for="backupEmail" class="form-label fw-semibold">備用信箱 <span class="text-muted fw-normal">（選填）</span></label>
            <input id="backupEmail" type="email" class="form-control" maxlength="256" placeholder="推薦使用 gmail.com" autocomplete="email" />
            <div class="form-text">只有系統已登記的主信箱與備用信箱會收到重設連結；未登記的信箱僅供管理員協助確認。</div>
          </div>
          <div class="cf-turnstile" data-sitekey="__TURNSTILE_SITE_KEY__" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired" data-error-callback="onTurnstileExpired" id="turnstileWidget"></div>
          <button type="submit" class="btn btn-reset w-100" id="requestBtn" disabled>
            <span id="requestSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
            寄送重設連結
          </button>
        </form>

        <form id="confirmForm" class="d-none">
          <p class="text-muted small">請設定至少 8 個字元的新密碼。完成後，其他裝置上的登入狀態將失效。</p>
          <div class="mb-3">
            <label for="newPassword" class="form-label fw-semibold">新密碼</label>
            <input id="newPassword" type="password" minlength="8" maxlength="128" class="form-control" required autocomplete="new-password" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
          </div>
          <div class="mb-4">
            <label for="confirmPassword" class="form-label fw-semibold">確認新密碼</label>
            <input id="confirmPassword" type="password" minlength="8" maxlength="128" class="form-control" required autocomplete="new-password" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
          </div>
          <button type="submit" class="btn btn-reset w-100" id="confirmBtn">
            <span id="confirmSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
            儲存新密碼
          </button>
        </form>

        <div class="text-center mt-3"><a href="/login" class="text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>返回登入</a></div>
      </div>
    </div>
  </main>
  <script src="/static/reset-password.js"></script>
</body>
</html>
