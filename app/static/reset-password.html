<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重設密碼 - AI 英語面試練習系統</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI 英語面試" />
  <meta name="application-name" content="AI 英語面試" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="/static/pwa.js?v=7" defer></script>
  <style>
    body { min-height:100vh; background:linear-gradient(135deg,#1e1b4b,#4338ca 70%,#6d28d9); display:flex; align-items:center; justify-content:center; }
    .reset-wrap { width:100%; max-width:500px; padding:1rem; }
    .reset-card { background:rgba(255,255,255,.98); border-radius:20px; box-shadow:0 25px 60px rgba(0,0,0,.35); overflow:hidden; }
    .reset-header { background:linear-gradient(135deg,#4f46e5,#7c3aed); padding:1.75rem 2rem; text-align:center; color:#fff; }
    .reset-header i { font-size:2rem; }
    .reset-header h1 { font-size:1.35rem; font-weight:700; margin:.5rem 0 0; }
    .reset-body { padding:2rem; }
    .form-control:focus { box-shadow:none; border-color:#6366f1; }
    .btn-reset { background:linear-gradient(135deg,#4f46e5,#7c3aed); border:0; color:#fff; font-weight:600; padding:.7rem; border-radius:10px; }
    .btn-reset:hover { color:#fff; opacity:.9; }
    .cf-turnstile { display:flex; justify-content:center; margin-bottom:1rem; }
  </style>
</head>
<body>
  <main class="reset-wrap">
    <div class="reset-card">
      <header class="reset-header">
        <i class="bi bi-shield-lock"></i>
        <h1 id="pageTitle">申請重設密碼</h1>
      </header>
      <div class="reset-body">
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="requestForm">
          <p class="text-muted small">請輸入與系統相符的學生資料。若系統已登記備用信箱，可一併填寫確認。</p>
          <div class="mb-3">
            <label for="courseNum" class="form-label fw-semibold">課號</label>
            <input id="courseNum" class="form-control" required autocomplete="off" />
          </div>
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">姓名</label>
            <input id="name" class="form-control" required autocomplete="name" />
          </div>
          <div class="mb-3">
            <label for="studentId" class="form-label fw-semibold">學號</label>
            <input id="studentId" class="form-control" required autocomplete="off" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
          </div>
          <div class="mb-3">
            <label for="backupEmail" class="form-label fw-semibold">備用信箱 <span class="text-muted fw-normal">（選填）</span></label>
            <input id="backupEmail" type="email" class="form-control" placeholder="推薦使用 gmail.com" autocomplete="email" />
            <div class="form-text">只有系統已登記的主信箱與備用信箱會收到重設連結；未登記的信箱僅供管理員協助確認。</div>
          </div>
          <div class="cf-turnstile" data-sitekey="__TURNSTILE_SITE_KEY__" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired" data-error-callback="onTurnstileExpired" id="turnstileWidget"></div>
          <button type="submit" class="btn btn-reset w-100" id="requestBtn" disabled>
            <span id="requestSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
            寄送重設連結
          </button>
        </form>

        <form id="confirmForm" class="d-none">
          <p class="text-muted small">請設定至少 8 個字元的新密碼。完成後，其他裝置上的登入狀態將失效。</p>
          <div class="mb-3">
            <label for="newPassword" class="form-label fw-semibold">新密碼</label>
            <input id="newPassword" type="password" minlength="8" class="form-control" required autocomplete="new-password" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
          </div>
          <div class="mb-4">
            <label for="confirmPassword" class="form-label fw-semibold">確認新密碼</label>
            <input id="confirmPassword" type="password" minlength="8" class="form-control" required autocomplete="new-password" readonly data-action-focus="clearReadonlyAttr" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" />
          </div>
          <button type="submit" class="btn btn-reset w-100" id="confirmBtn">
            <span id="confirmSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
            儲存新密碼
          </button>
        </form>

        <div class="text-center mt-3"><a href="/login" class="text-decoration-none small"><i class="bi bi-arrow-left me-1"></i>返回登入</a></div>
      </div>
    </div>
  </main>
  <script src="/static/reset-password.js?v=2"></script>
</body>
</html>
