name: oral

services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-meet}\" -d \"$${POSTGRES_DB:-meetdb}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${MEET_IMAGE:?Set MEET_IMAGE to a pinned image digest}
    pull_policy: always
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    command: ["python", "scripts/bootstrap_database.py"]

  pg_backup:
    image: postgres:15
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      PGHOST: db
      PGPORT: "5432"
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_TIME: "03:00"
      TZ: Asia/Taipei
    volumes:
      - ./pg_backup:/backups
      - type: bind
        source: ./scripts/postgres_backup.sh
        target: /scripts/postgres_backup.sh
        read_only: true
        bind:
          create_host_path: false
    command: ["bash", "/scripts/postgres_backup.sh"]

  web:
    image: ${MEET_IMAGE:?Set MEET_IMAGE to a pinned image digest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    ports:
      - "7682:7682"

volumes:
  postgres_data:
