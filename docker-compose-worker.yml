name: oral-cht-worker

services:
  worker:
    image: ${MEET_IMAGE:?Set MEET_IMAGE to an immutable image digest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.worker}
    expose:
      - "7682"
    command:
      - sh
      - -c
      - >-
        exec gunicorn app.worker_main:app
        --worker-class uvicorn.workers.UvicornWorker
        --workers $${GUNICORN_WORKERS:-2}
        --bind 0.0.0.0:7682
        --forwarded-allow-ips $${FORWARDED_ALLOW_IPS:-127.0.0.1}
        --timeout 180
        --graceful-timeout 30
        --keep-alive 5
        --no-control-socket
